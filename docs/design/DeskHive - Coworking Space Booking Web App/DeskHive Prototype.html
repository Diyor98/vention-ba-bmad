  // ════════════════════════════════════════════════════════════
  // MUTABLE STORE — replaces alert() calls with real state changes.
  // Approve/reject/cancel mutate the same APPLICATIONS / BOOKINGS /
  // HOST_BOOKINGS arrays, then notify subscribers so tables re-render.
  // Add/edit operations flow through here so a newly listed space shows
  // up on Browse, in Host spaces, and so on.
  // ════════════════════════════════════════════════════════════
  const store = {
    listeners: new Set(),
    emit() { this.listeners.forEach(l => l()); },
    _patch(arr, id, patch) {
      const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = { ...arr[i], ...patch };
    },
    setAppStatus(id, status)         { this._patch(APPLICATIONS,   id, { status }); this.emit(); },
    approveApplication(id) {
      const a = APPLICATIONS.find(x => x.id === id);
      this._patch(APPLICATIONS, id, { status: "Approved" });
      // Promote the user to Host. Match by email; insert if not yet on the platform.
      if (a) {
        const u = USERS.find(x => x.email === a.email);
        if (u) { u.role = "Host"; }
        else {
          USERS.push({
            id: `u-app-${id}`, name: a.applicant, email: a.email, role: "Host",
            joined: a.submitted, spaces: 0, avatar: AV(20 + (USERS.length % 40)),
          });
        }
      }
      this.emit();
    },
    setBookingStatus(id, status)     {
      // Cancelling or being rejected pushes the booking into "past" so it
      // leaves the upcoming sections of My bookings.
      const phase = (status === "Cancelled" || status === "Rejected") ? "past" : undefined;
      this._patch(BOOKINGS, id, phase ? { status, phase } : { status });
      this.emit();
    },
    setHostBookingStatus(id, status) { this._patch(HOST_BOOKINGS, id, { status }); this.emit(); },
    addSpace(space) {
      SPACES.unshift(space);          // newest first on Browse
      this.emit();
    },
    updateSpace(id, patch)           { this._patch(SPACES, id, patch); this.emit(); },
    setUserRole(id, role)            { this._patch(USERS, id, { role }); this.emit(); },
    removeUser(id) {
      const i = USERS.findIndex(u => u.id === id);
      if (i >= 0) USERS.splice(i, 1);
      this.emit();
    },
    setStripe(patch) {
      Object.assign(HOST_PROFILE, patch);
      this.emit();
    },
  };
  function useStore() {
    const [, force] = useState(0);
    useEffect(() => {
      const l = () => force(v => v + 1);
      store.listeners.add(l);
      return () => store.listeners.delete(l);
    }, []);
  }

  // ════════════════════════════════════════════════════════════
  // TOAST / NOTIFICATION CARDS
  // Used for every approve / save / book outcome. Stacked top-right,
  // auto-dismiss after ~4.5s, dismissable with the × button.
  // ════════════════════════════════════════════════════════════
  const toastBus = {
    listeners: new Set(),
    items: [],
    show(t) {
      const id = ++toastBus._id;
      const item = { id, kind: "info", duration: 4500, ...t };
      this.items = [...this.items, item];
      this.listeners.forEach(l => l());
      if (item.duration) setTimeout(() => this.dismiss(id), item.duration);
      return id;
    },
    dismiss(id) {
      this.items = this.items.filter(t => t.id !== id);
      this.listeners.forEach(l => l());
    },
    _id: 0,
  };
  const notify = {
    success: (title, message, opts={}) => toastBus.show({ kind: "success", title, message, ...opts }),
    info:    (title, message, opts={}) => toastBus.show({ kind: "info",    title, message, ...opts }),
    warn:    (title, message, opts={}) => toastBus.show({ kind: "warn",    title, message, ...opts }),
    error:   (title, message, opts={}) => toastBus.show({ kind: "error",   title, message, ...opts }),
  };

  function ToastViewport() {
    const [, force] = useState(0);
    useEffect(() => {
      const l = () => force(v => v + 1);
      toastBus.listeners.add(l);
      return () => toastBus.listeners.delete(l);
    }, []);
    const TONE = {
      success: { ring: "border-emerald-200", icon: "bg-emerald-100 text-emerald-700", Icon: Icon.Check, label: "Done" },
      info:    { ring: "border-indigo-200",  icon: "bg-indigo-100 text-indigo-700",   Icon: Icon.Info,  label: "Heads up" },
      warn:    { ring: "border-amber-200",   icon: "bg-amber-100 text-amber-700",     Icon: Icon.AlertTriangle, label: "Heads up" },
      error:   { ring: "border-red-200",     icon: "bg-red-100 text-red-700",         Icon: Icon.X,     label: "Failed" },
    };
    return (
      <div className="fixed top-4 right-4 z-[60] flex flex-col gap-2.5 w-[min(380px,calc(100vw-2rem))] pointer-events-none" aria-live="polite">
        {toastBus.items.map(t => {
          const tone = TONE[t.kind] || TONE.info;
          const Ic = tone.Icon;
          return (
            <div key={t.id}
                 role="status"
                 className={`pointer-events-auto bg-white border ${tone.ring} rounded-xl shadow-lg shadow-gray-900/5 overflow-hidden`}
                 style={{ animation: "tIn .22s ease-out" }}>
              <div className="p-3.5 flex items-start gap-3">
                <span className={`w-8 h-8 rounded-lg grid place-items-center flex-none ${tone.icon}`}><Ic size={16}/></span>
                <div className="flex-1 min-w-0">
                  <div className="text-[13.5px] font-semibold text-gray-900 tracking-tight">{t.title}</div>
                  {t.message && <div className="text-[12.5px] text-gray-600 mt-0.5 leading-snug">{t.message}</div>}
                  {t.action && (
                    <button onClick={()=>{ t.action.onClick?.(); toastBus.dismiss(t.id); }}
                            className="mt-2 text-[12px] font-semibold text-indigo-700 hover:underline">
                      {t.action.label} →
                    </button>
                  )}
                </div>
                <button onClick={()=>toastBus.dismiss(t.id)} className="p-1 text-gray-400 hover:text-gray-700 -m-1" aria-label="Dismiss"><Icon.X size={14}/></button>
              </div>
            </div>
          );
        })}
        <style>{`@keyframes tIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }`}</style>
      </div>
    );
  }

  // ════════════════════════════════════════════════════════════
  // CONFIRM DIALOG — double-confirmation for destructive actions
  // (reject application, reject booking, cancel booking, etc).
  // Open with `confirmBus.ask({ title, message, ..., onConfirm })`.
  // ════════════════════════════════════════════════════════════
  const confirmBus = {
    listeners: new Set(),
    current: null,
    ask(opts) { this.current = { ...opts, id: ++this._id }; this.listeners.forEach(l => l()); },
    close()   { this.current = null; this.listeners.forEach(l => l()); },
    _id: 0,
  };

  function ConfirmHost() {
    const [, force] = useState(0);
    const noteRef = useRef(null);
    useEffect(() => {
      const l = () => force(v => v + 1);
      confirmBus.listeners.add(l);
      return () => confirmBus.listeners.delete(l);
    }, []);
    const c = confirmBus.current;
    if (!c) return null;
    const tone = c.tone || "danger";
    const Tone = {
      danger: { ring:"bg-red-100 text-red-700",     btn:"danger",  Icon: Icon.AlertTriangle },
      warn:   { ring:"bg-amber-100 text-amber-700", btn:"primary", Icon: Icon.AlertTriangle },
      info:   { ring:"bg-indigo-100 text-indigo-700", btn:"primary", Icon: Icon.Info },
    }[tone];
    const Ic = Tone.Icon;
    return (
      <div className="fixed inset-0 bg-gray-900/45 backdrop-blur-sm grid place-items-center z-[55] p-4"
           onClick={()=>confirmBus.close()}>
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden" onClick={e=>e.stopPropagation()}>
          <div className="p-5 flex items-start gap-3.5">
            <span className={`w-10 h-10 rounded-xl grid place-items-center flex-none ${Tone.ring}`}><Ic size={18}/></span>
            <div className="flex-1 min-w-0">
              <div className="text-base font-semibold text-gray-900 tracking-tight">{c.title}</div>
              {c.message && <div className="text-[13px] text-gray-600 mt-1 leading-relaxed">{c.message}</div>}
              {c.askNote && (
                <div className="mt-3">
                  <label className="block text-[12px] font-medium text-gray-700 mb-1">{c.noteLabel || "Note (optional)"}</label>
                  <textarea ref={noteRef} rows="3" placeholder={c.notePlaceholder || "Share a reason — they'll see this in the email."}
                    className="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm placeholder:text-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/>
                </div>
              )}
              {c.detail && <div className="mt-3 p-3 bg-gray-50 border border-gray-200 rounded-lg text-[12.5px] text-gray-700 leading-relaxed">{c.detail}</div>}
            </div>
          </div>
          <div className="px-5 py-3.5 bg-gray-50 border-t border-gray-100 flex justify-end gap-2">
            <button onClick={()=>{ c.onCancel?.(); confirmBus.close(); }}
                    className="px-3.5 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100">{c.cancelLabel || "Cancel"}</button>
            <Btn kind={Tone.btn} onClick={()=>{ const note = noteRef.current?.value || ""; c.onConfirm?.(note); confirmBus.close(); }}>
              {c.confirmLabel || "Confirm"}
            </Btn>
          </div>
        </div>
      </div>
    );
  }

  // ════════════════════════════════════════════════════════════
  // STYLE PRIMITIVES
  // ════════════════════════════════════════════════════════════
  const STATUS_PILL = {

    Approved:  "bg-emerald-100 text-emerald-800",
    Rejected:  "bg-red-100 text-red-800",
    Active:    "bg-blue-100 text-blue-800",
    Confirmed: "bg-blue-100 text-blue-800",
    Cancelled: "bg-gray-100 text-gray-700",
    Draft:     "bg-gray-100 text-gray-700",
    Paid:      "bg-emerald-100 text-emerald-800",
  };
  const ROLE_PILL = {
    Public: "bg-gray-100 text-gray-700",
    Guest:  "bg-emerald-100 text-emerald-800",
    Host:   "bg-indigo-100 text-indigo-800",
    Admin:  "bg-gray-900 text-white",
    System: "bg-amber-100 text-amber-800",
  };

  const Pill = ({ children, kind = "Pending", className = "" }) =>
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] font-medium rounded-full ${STATUS_PILL[kind] || STATUS_PILL.Pending} ${className}`}>

  const Btn = ({ children, kind = "primary", className = "", icon: Ic, onClick, type = "button", disabled }) => {

  // ════════════════════════════════════════════════════════════

      { href:"/signup", label:"Sign up" },
    ]},

      { href:"/browse",        label:"Browse spaces" },
      { href:"/bookings",      label:"My bookings" },
      { href:"/become-a-host", label:"Become a host" },
      { href:"/account",       label:"Account" },
    ]},
    host:   { home: "/host",   label: "Host",   links: [

    ]},
  };

  function useHashRoute() {
    const [hash, setHash] = useState(() => window.location.hash || "#/");
    useEffect(() => {
      const onChange = () => setHash(window.location.hash || "#/");
      window.addEventListener("hashchange", onChange);
      return () => window.removeEventListener("hashchange", onChange);
    }, []);
    // Strip any query string ("?…") off the path before route matching — the
    // booking flow uses ?space=…&desk=… so screens can deep-link with context.
    return (hash.replace(/^#/, "").split("?")[0]) || "/";
  }
  const go = (path) => { window.location.hash = path; };

  // ════════════════════════════════════════════════════════════
  // SHELL — top nav, role switcher, footer, prototype index
  // ════════════════════════════════════════════════════════════
  function Shell({ role, setRole, route, children, audience }) {
    const [indexOpen, setIndexOpen] = useState(false);
    const links = ROUTES[role].links;
    // Compute the single most-specific active link so two nav items can't
    // light up at once (e.g. /host and /host/spaces both used to match).
    const activeHref = links.reduce((best, l) => {
      const matches = route === l.href || (l.href !== "/" && route.startsWith(l.href + "/"));
      return matches && l.href.length > (best?.length ?? -1) ? l.href : best;
    }, null);
    return (
      <div className="min-h-screen bg-[#FAFAFA] flex flex-col">
        {/* Top bar */}
        <header className="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-gray-200">
          <div className="max-w-7xl mx-auto px-6 h-14 flex items-center gap-6">
            <a href="#/" onClick={(e)=>{e.preventDefault(); setRole("public"); go("/");}} className="flex items-center gap-2 font-semibold text-gray-900">
              <span className="w-6 h-6 rounded-md bg-indigo-600 grid place-items-center">
                <span className="block w-2 h-2 bg-white rounded-[2px]"></span>
              </span>
              DeskHive
            </a>
            <nav className="hidden md:flex items-center gap-1">
              {links.map(l => {
                const active = l.href === activeHref;
                return (
                  <a key={l.href} href={`#${l.href}`} onClick={(e)=>{e.preventDefault();go(l.href);}}
                     className={`px-3 py-1.5 rounded-md text-sm font-medium ${active ? "bg-indigo-50 text-indigo-700" : "text-gray-600 hover:text-gray-900 hover:bg-gray-100"}`}>
                    {l.label}
                  </a>
                );
              })}
            </nav>
            <div className="flex-1"></div>
            <RoleSwitcher role={role} setRole={setRole} />
            {role !== "public" && <UserMenu role={role} setRole={setRole} />}
          </div>
        </header>

        {/* Page banner */}
        <div className="max-w-7xl mx-auto px-6 mt-6 w-full flex items-center gap-3">
          <div className="mono text-[11px] text-gray-400 tracking-wider">CURRENT VIEW</div>
          <code className="mono text-[11px] px-2 py-0.5 rounded-md bg-gray-900 text-white">{route}</code>
          {audience && <span className={`text-[11px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ${ROLE_PILL[audience]}`}>{audience}</span>}

                className="fixed bottom-5 left-5 z-40 inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-gray-900 text-white text-sm font-medium shadow-lg hover:bg-gray-800">
          <Icon.Grid size={15}/> Prototype index
        </button>

        {indexOpen && <PrototypeIndex onClose={()=>setIndexOpen(false)} setRole={setRole} />}

        {/* Global notification + confirm-dialog hosts */}
        <ToastViewport/>
        <ConfirmHost/>

        {/* Footer */}
        <footer className="border-t border-gray-200 mt-16 py-6">
          <div className="max-w-7xl mx-auto px-6 flex items-center justify-between text-xs text-gray-500">
            <span>DeskHive · clickable prototype</span>
            <code className="mono px-2 py-0.5 rounded bg-gray-100 border border-gray-200">{route}</code>
          </div>
        </footer>
      </div>
    );
  }

  function RoleSwitcher({ role, setRole }) {
    const roles = ["public","guest","host","admin"];
    return (
      <div className="flex items-center gap-1 p-0.5 rounded-lg bg-gray-100 border border-gray-200">
        {roles.map(r => {
          const active = role === r;
          return (
            <button key={r}
                    onClick={()=>{ setRole(r); go(ROUTES[r].home); }}
                    className={`px-2.5 py-1 text-xs font-medium rounded-md capitalize ${active ? "bg-white text-gray-900 shadow-sm" : "text-gray-500 hover:text-gray-900"}`}>
              {r}
            </button>
          );
        })}
      </div>
    );
  }

  function UserMenu({ role, setRole }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);
    useEffect(()=>{
      const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener("mousedown", onDoc);
      return () => document.removeEventListener("mousedown", onDoc);

    const me = { guest: "Avery Chen", host: "Jordan Reyes", admin: "Ada Hollander" }[role];

            ? <img src={meAvatar} alt={me} className="w-7 h-7 rounded-full object-cover ring-1 ring-gray-200"/>

              <div className="text-xs text-gray-500 mt-0.5">{role}@deskhive.demo</div>
            </div>
            <div className="py-1.5">
              {role === "guest" && <MenuItem icon={Icon.Calendar} label="My bookings" onClick={()=>go("/bookings")}/>}
              {role === "guest" && <MenuItem icon={Icon.Sparkle}  label="Become a host" onClick={()=>go("/become-a-host")}/>}
              {role === "host"  && <MenuItem icon={Icon.LayoutDashboard} label="Host dashboard" onClick={()=>go("/host")}/>}
              {role === "host"  && <MenuItem icon={Icon.Banknote} label="Payouts" onClick={()=>go("/host/payouts")}/>}
              {role === "admin" && <MenuItem icon={Icon.Users}    label="Users" onClick={()=>go("/admin/users")}/>}
              <MenuItem icon={Icon.Settings} label="Account" onClick={()=>{ if (role === "host") go("/host/payouts"); else go("/account"); }}/>
              <MenuItem icon={Icon.LogOut}   label="Sign out" onClick={()=>{ setRole("public"); go("/login"); }}/>
            </div>
          </div>
        )}
      </div>
    );
  }
  const MenuItem = ({ icon: Ic, label, onClick }) =>
    <button onClick={onClick} className="w-full flex items-center gap-2.5 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
      <Ic size={15} className="text-gray-400"/> {label}

  function PrototypeIndex({ onClose, setRole }) {
    const groups = [
      { role: "public", title: "Public",
        items: [["/", "Landing"],["/login","Sign in"],["/signup","Sign up"]]},
      { role: "guest", title: "Guest",

            </div>
            <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><Icon.X size={16}/></button>

            {groups.map(g => (

                        <code className="mono text-[11px] text-gray-400">{href}</code>
                      </button>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ════════════════════════════════════════════════════════════
  // SHARED PAGE PARTS
  // ════════════════════════════════════════════════════════════
  const Page = ({ children, max = "max-w-7xl" }) =>
    <div className={`${max} mx-auto px-6 py-8`}>{children}</div>;

  // 4 · /booking/new — Stripe Checkout simulation

  // return to /space/[id] with a success toast (PRD §5.9).
  function BookingFlow() {
    useStore();
    // Pull context out of the URL hash so the flow shows the right space/desk.
    const params = new URLSearchParams(window.location.hash.split("?")[1] || "");
    const spaceId = params.get("space") || "cedar-and-co";
    const deskId  = params.get("desk")  || "d1";
    const date    = params.get("date")  || "2026-05-18";
    const space   = SPACES.find(s => s.id === spaceId) || SPACES[0];
    const desk    = (DESKS_BY_SPACE[space.id] || DESKS_BY_SPACE["cedar-and-co"]).find(d => d.id === deskId)
                 || (DESKS_BY_SPACE[space.id] || DESKS_BY_SPACE["cedar-and-co"])[0];

    const subtotal = desk.price;
    const fee = +(subtotal * 0.15).toFixed(2);
    const total = +(subtotal + fee).toFixed(2);

    const [redirecting, setRedirecting] = useState(true);
    const [card, setCard] = useState("4242 4242 4242 4242");
    const [exp,  setExp]  = useState("12 / 28");
    const [cvc,  setCvc]  = useState("123");
    const [email, setEmail] = useState("avery.chen@gmail.com");
    const [processing, setProcessing] = useState(false);

    useEffect(() => {
      // Brief "Redirecting to Stripe…" interstitial.
      const t = setTimeout(() => setRedirecting(false), 900);
      return () => clearTimeout(t);
    }, []);

    const pay = () => {
      setProcessing(true);
      setTimeout(() => {
        // Create the booking (Pending until host confirms).
        const newId = `BK-${3100 + Math.floor(Math.random()*900)}`;
        BOOKINGS.unshift({
          id: newId, space: space.name, spaceId: space.id, desk: desk.label,
          date: formatDateLong(date), price: subtotal, fee, total,
          status: "Pending", guest: "You", phase: "upcoming",
        });
        // Mirror it on the host side so the space owner sees the request.
        HOST_BOOKINGS.unshift({
          id: newId, space: space.name, desk: desk.label.split(" · ")[0],
          date: formatDateLong(date), gross: subtotal, fee, net: +(subtotal-fee).toFixed(2),
          status: "Pending", guest: "Avery Chen",
        });
        store.emit();
        notify.success("Booking requested",
          `We'll let you know when ${space.name} confirms. Your card is held — you won't be charged until then.`,
          { action: { label: "See My bookings", onClick: () => go("/bookings") } });
        // PRD: return to Space Detail with toast.
        go(`/space/${space.id}`);
      }, 900);
    };

    if (redirecting) {
      return (
        <div className="min-h-[60vh] grid place-items-center px-6 py-12">
          <div className="text-center">
            <div className="w-12 h-12 rounded-full border-2 border-indigo-200 border-t-indigo-600 mx-auto animate-spin"></div>
            <div className="mt-4 text-base font-semibold text-gray-900 tracking-tight">Redirecting to Stripe Checkout…</div>
            <div className="mt-1 text-sm text-gray-500">DeskHive uses Stripe for secure payments.</div>
          </div>
        </div>
      );
    }

    // Stripe-Checkout-ish layout: left = pay form, right = summary.
    return (
      <div className="bg-[#F6F9FC] min-h-[80vh]">
        <Page max="max-w-5xl">
          {/* Faux Stripe chrome */}
          <div className="mb-6 flex items-center gap-3">
            <div className="flex items-center gap-2 text-[11px] text-gray-500 mono">
              <span className="inline-flex items-center justify-center w-5 h-5 rounded bg-[#635BFF] text-white text-[10px] font-bold">S</span>

              <span className="text-gray-300">·</span>
              <span>Test mode</span>
            </div>
            <button onClick={()=>go(`/space/${space.id}`)} className="ml-auto inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900">

            {/* Right (visually) — but in DOM left for stacking on mobile */}
            <Card className="p-6 order-1 md:order-2 sticky top-20">
              <div className="text-xs text-gray-500 font-medium uppercase tracking-wide">Pay DeskHive</div>
              <div className="mt-1 text-3xl font-semibold text-gray-900 tracking-tight">${total.toFixed(2)}</div>
              <div className="mt-1 text-[12px] text-gray-500">Authorisation only. You'll only be charged after the host confirms.</div>
              <div className="mt-5 flex items-center gap-3">
                <div className="w-14 h-14 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0">
                  <img src={space.photo} alt={space.name} className="w-full h-full object-cover"/>
                </div>
                <div className="min-w-0">
                  <div className="text-sm font-medium text-gray-900 truncate">{space.name}</div>
                  <div className="text-[12px] text-gray-500 truncate">{desk.label} · {date}</div>
                </div>
              </div>
              <div className="mt-5 border-t border-gray-100 pt-4 space-y-1.5">
                <Row k="Day rate"        v={`$${subtotal.toFixed(2)}`}/>
                <Row k="Platform fee · 15%" v={`$${fee.toFixed(2)}`}/>
                <div className="border-t border-gray-100 my-2"></div>

  function formatDateLong(iso) {

    try {
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  // upcoming phase), Past & archived (everything else). Cancel + Book again
  // are wired to the mutable store so the UI actually reflects the change.
  function MyBookings() {
    useStore();
    const awaiting = BOOKINGS.filter(b => b.phase === "upcoming" && b.status === "Pending");
    const upcoming = BOOKINGS.filter(b => b.phase === "upcoming" && b.status === "Confirmed");

        {total === 0 ? (

            <BookingSection

  function BookingSection({ id, title, count, help, bookings, variant, className = "" }) {
    if (bookings.length === 0) return null;
    return (
      <section aria-labelledby={id} className={className}>
        <div className="flex items-baseline justify-between border-b border-gray-200 pb-2.5 mb-4">
          <h2 id={id} className="text-xs font-semibold tracking-[0.08em] uppercase text-gray-700">{title}</h2>
          <span className="text-[11px] text-gray-400 mono">{count}</span>

          {bookings.map(b => <BookingCard key={b.id} b={b} variant={variant}/>)}
        </ul>
      </section>
    );
  }

  function BookingCard({ b, variant }) {
    const isArchived = variant === "archived";
    const visitComplete = isArchived && b.status === "Confirmed";
    // Day-pass bookings = full space hours; static for the prototype.
    const time = "9:00 AM – 6:00 PM";

    // Refund eligibility — full refund if the booking is more than 24h away.
    // "Today" is May 16, 2026 (matches the system clock the prototype runs in).
    const today = new Date("2026-05-16T12:00:00");
    const bookingDate = new Date(b.date + " 09:00:00");
    const hoursUntil = (bookingDate - today) / 36e5;
    const refundable = hoursUntil >= 24;

    let context = "";
    if (b.status === "Pending")        context = "Requested recently · usually responds within 24h";
    else if (b.status === "Confirmed" && !isArchived) context = "Confirmed · check-in at the front desk";
    else if (visitComplete)            context = "Visit complete";
    else if (b.status === "Cancelled") context = b.refundIssued ? `Cancelled · ${b.currency || "$"}${(b.total).toFixed(2)} refunded to your card`  : "You cancelled this request";
    else if (b.status === "Rejected")  context = "Space was fully booked for that date";

    const cardBg = isArchived ? "bg-gray-50/60" : "bg-white";

    const askCancel = () => {
      if (!refundable && b.status !== "Pending") {
        notify.warn("Cancellation not eligible", "Bookings within 24 hours can't be cancelled for a refund. Contact the space directly if you can't make it.");
        return;
      }
      const isPending = b.status === "Pending";
      confirmBus.ask({
        title: isPending ? "Cancel this request?" : `Cancel and refund $${b.total.toFixed(2)}?`,
        message: isPending
          ? "We haven't charged you yet — your card hold will be released. The space owner will be notified."
          : "Your card will be refunded in full via Stripe. Refunds typically clear in 5–10 business days.",
        detail: <><strong>{b.space}</strong> · {b.desk} · {b.date}</>,
        confirmLabel: isPending ? "Cancel request" : "Cancel and refund",
        cancelLabel: "Keep booking",
        tone: isPending ? "warn" : "danger",
        onConfirm: () => {
          if (isPending) {
            store.setBookingStatus(b.id, "Cancelled");
            notify.info("Booking cancelled", "We've let the space know. No charge will be made to your card.");
          } else {
            // Refunded cancellation
            const i = BOOKINGS.findIndex(x => x.id === b.id);
            if (i >= 0) BOOKINGS[i] = { ...BOOKINGS[i], status: "Cancelled", phase: "past", refundIssued: true };
            store.emit();
            notify.success(`Refund of $${b.total.toFixed(2)} issued`, "Stripe will return the funds to your card in 5–10 business days. We've emailed your receipt.");
          }
        },
      });
    };

    return (
      <li className={`${cardBg} border border-gray-200 rounded-2xl overflow-hidden transition-colors hover:border-gray-300`}>
        {/* HEADER — icon · title/sub · status */}
        <div className="grid items-start gap-4 p-5 sm:p-6"
             style={{ gridTemplateColumns: "auto minmax(0,1fr) auto" }}>
          <div className={`w-11 h-11 rounded-lg grid place-items-center flex-none ${isArchived ? "bg-gray-100 text-gray-400" : "bg-gray-100 text-gray-500"}`} aria-hidden="true">
            <Icon.Briefcase size={20}/>
          </div>
          <div className="min-w-0">
            <p className={`text-[17px] font-semibold tracking-tight leading-snug ${isArchived ? "text-gray-700" : "text-gray-900"}`}>{b.space} · {b.desk.split(" · ")[0]}</p>
            <p className="mt-0.5 text-[13px] text-gray-500">Hot desk · {SPACES.find(s=>s.id===b.spaceId)?.city || "—"}</p>
          </div>
          <div>
            <Pill kind={b.status}>{b.status}</Pill>
          </div>
        </div>

        {/* META — Date | Time */}
        <div className="grid grid-cols-2 gap-6 px-5 sm:px-6 py-4 border-t border-gray-100">
          <div>
            <p className="text-[12px] text-gray-500 mb-1">Date</p>
            <p className="text-[15px] font-semibold text-gray-900 tracking-tight mono">{b.date}</p>
          </div>
          <div>
            <p className="text-[12px] text-gray-500 mb-1">Time</p>
            <p className="text-[15px] font-semibold text-gray-900 tracking-tight mono">{time}</p>
          </div>
        </div>

        {/* FOOTER — context + actions */}
        <div className="grid items-center gap-3 px-5 sm:px-6 py-4 border-t border-gray-100"
             style={{ gridTemplateColumns: "minmax(0,1fr) auto" }}>
          <p className="text-[13px] text-gray-500">{context}</p>
          <div className="flex items-center gap-2 justify-self-end">
            {b.status === "Pending" && (
              <>
                <Btn kind="secondary" onClick={()=>go(`/space/${b.spaceId}`)}>View details</Btn>
                <Btn kind="ghost" onClick={askCancel}>Cancel request</Btn>
              </>
            )}
            {b.status === "Confirmed" && !isArchived && (
              <>
                <Btn kind="secondary" onClick={()=>go(`/space/${b.spaceId}`)}>View details</Btn>
                {refundable ? (
                  <Btn kind="ghost" onClick={askCancel}>Cancel &amp; refund</Btn>
                ) : (
                  <span title="Cancellations within 24 hours are not eligible for refund.">
                    <Btn kind="ghost" disabled>Cancel · within 24h</Btn>
                  </span>
                )}
              </>
            )}
            {(visitComplete || b.status === "Rejected") && (
              <Btn kind="secondary" onClick={()=>go(`/space/${b.spaceId}`)}>Book again</Btn>
            )}
          </div>
        </div>
      </li>
    );
  }

  // 15 · /host/spaces/new — multi-step form
  function HostSpaceNew() {
    const [step, setStep] = useState(1);
    const steps = ["Basics","Desks","Photos","Publish"];
    const [form, setForm] = useState({
      name: "", city: "", address: "", postal: "",
      about: "A great place to work.",
      price: 30,
      desks: [
        { id: "d1", label: "Desk 01 · Window",      price: 32 },
        { id: "d2", label: "Desk 02 · Window",      price: 32 },
        { id: "d3", label: "Desk 03 · Quiet booth", price: 38 },
      ],
    });
    const update = (patch) => setForm(f => ({ ...f, ...patch }));
    const updateDesk = (i, patch) => setForm(f => ({ ...f, desks: f.desks.map((d,j)=> j===i ? { ...d, ...patch } : d) }));
    const addDesk = () => setForm(f => ({ ...f, desks: [...f.desks, { id: `d${f.desks.length+1}`, label: `Desk 0${f.desks.length+1}`, price: f.price }] }));
    const removeDesk = (i) => setForm(f => ({ ...f, desks: f.desks.filter((_,j)=> j!==i) }));

    const publish = () => {
      // Generate a kebab-case id from the name (or a fallback timestamp).
      const slug = (form.name || "new-space").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || `space-${Date.now()}`;
      const photo = UNS("1497366216548-37526070297c");
      const lowestPrice = form.desks.reduce((m,d)=> Math.min(m, Number(d.price)||32), 99) || 32;
      store.addSpace({
        id: slug,
        name: form.name || "Untitled space",
        city: form.city || "—",
        neighborhood: form.address || "Downtown",
        blurb: form.about.slice(0, 60),
        price: lowestPrice,
        currency: "$",
        desks: form.desks.length,
        spotsLeft: form.desks.length,
        amenities: ["wifi","coffee"],
        host: "Jordan Reyes",
        rating: 5.0,
        reviews: 0,
        status: "Active",
        photo,
        photos: [photo, photo, photo],
      });
      // Seed desks too so the space detail page renders correctly.
      DESKS_BY_SPACE[slug] = form.desks.map(d => ({
        id: d.id, label: d.label, price: Number(d.price)||32, status: "available",
      }));
      notify.success("Space published", `${form.name || "Your space"} is now live on Browse. Bookings will start flowing in.`,
        { action: { label: "View on Browse", onClick: () => go("/browse") } });
      go("/host/spaces");
    };

    return (
      <Page max="max-w-4xl">
        <button onClick={()=>go("/host/spaces")} className="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900 mb-4">
          <Icon.ArrowLeft size={14}/> Back to my spaces
        </button>
        <PageHead title="List a new space" sub="Four steps. About 5 minutes."/>
        <div className="flex items-center gap-2 mb-6">
          {steps.map((s,i)=>{
            const n = i+1;
            const active = step === n;
            const done = step > n;
            return (
              <React.Fragment key={s}>
                <button onClick={()=>setStep(n)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium ${active ? "bg-indigo-50 text-indigo-700" : done ? "text-emerald-700" : "text-gray-500 hover:bg-gray-100"}`}>
                  <span className={`w-5 h-5 rounded-full text-[11px] grid place-items-center ${active ? "bg-indigo-600 text-white" : done ? "bg-emerald-100 text-emerald-700" : "bg-gray-100 text-gray-600"}`}>{done ? "✓" : n}</span>
                  {s}
                </button>
                {n < steps.length && <span className="text-gray-300">/</span>}
              </React.Fragment>
            );
          })}
        </div>
        <Card className="p-6">
          {step === 1 && <>
            <h2 className="text-sm font-semibold text-gray-900 mb-4">Basics</h2>
            <div className="grid grid-cols-2 gap-4">
              <Field label="Space name"><Input placeholder="e.g. Westside Workshop" value={form.name} onChange={e=>update({name: e.target.value})}/></Field>
              <Field label="City"><Input placeholder="Portland, OR" value={form.city} onChange={e=>update({city: e.target.value})}/></Field>
              <Field label="Street address"><Input placeholder="123 NW 12th Ave" value={form.address} onChange={e=>update({address: e.target.value})}/></Field>
              <Field label="Postal code"><Input placeholder="97209" value={form.postal} onChange={e=>update({postal: e.target.value})}/></Field>
            </div>
            <div className="mt-3"><Field label="About"><Textarea rows="3" placeholder="What makes this space special?" value={form.about} onChange={e=>update({about: e.target.value})}/></Field></div>
          </>}
          {step === 2 && <>
            <h2 className="text-sm font-semibold text-gray-900 mb-4">Desks &amp; rates</h2>
            <div className="border border-gray-200 rounded-lg divide-y divide-gray-100">
              {form.desks.map((d,i) => (
                <div key={i} className="flex items-center gap-3 px-4 py-3">
                  <Input value={d.label} onChange={e=>updateDesk(i, { label: e.target.value })} className="flex-1"/>
                  <div className="relative w-28">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">$</span>
                    <Input type="number" value={d.price} onChange={e=>updateDesk(i, { price: e.target.value })} className="pl-6"/>
                  </div>
                  <button onClick={()=>removeDesk(i)} className="text-gray-400 hover:text-red-600" aria-label="Remove desk"><Icon.Trash size={15}/></button>
                </div>
              ))}
            </div>
            <Btn kind="secondary" icon={Icon.Plus} className="mt-3" onClick={addDesk}>Add desk</Btn>
          </>}
          {step === 3 && <>
            <h2 className="text-sm font-semibold text-gray-900 mb-4">Photos</h2>
            <div className="border-2 border-dashed border-gray-200 rounded-lg p-10 grid place-items-center text-center">
              <Icon.Upload size={22} className="text-gray-400 mx-auto"/>
              <div className="mt-2 text-sm text-gray-700">Drag photos here, or <span className="text-indigo-600 font-medium">browse</span></div>
              <div className="text-xs text-gray-500 mt-1">Minimum 3 photos · landscape orientation works best</div>
            </div>
          </>}
          {step === 4 && <>
            <h2 className="text-sm font-semibold text-gray-900 mb-4">Review &amp; publish</h2>
            <div className="grid grid-cols-2 gap-4 text-sm">
              <KV k="Name" v={form.name || "—"}/>
              <KV k="City" v={form.city || "—"}/>
              <KV k="Desks" v={`${form.desks.length} (with rates)`}/>
              <KV k="Photos" v="0 uploaded"/>

              Once published, your space appears on the public Browse page within minutes.
            </div>
          </>}
          <div className="mt-6 pt-5 border-t border-gray-100 flex justify-between">
            <Btn kind="ghost" onClick={()=>setStep(Math.max(1, step-1))}>Back</Btn>
            {step < 4
              ? <Btn icon={Icon.ArrowRight} onClick={()=>setStep(step+1)}>Continue</Btn>
              : <Btn icon={Icon.Check} onClick={publish}>Publish space</Btn>}
          </div>
        </Card>
      </Page>
    );
  }

                    {[
                      ["daily","Daily","Faster cash flow"],

          </div>
        </Page>

            ? <><span className="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin"></span> Saving…</>
            : <>{nextLabel} <Icon.ArrowRight size={14}/></>}

    );

    return (
      <Page>
        <PageHead title="Users" sub={`${USERS.length} total · ${USERS.filter(u=>u.role==="Host").length} hosts · ${USERS.filter(u=>u.role==="Guest").length} guests`}/>
        <div className="flex items-center gap-2 mb-4">
          {["All","Guest","Host","Admin"].map(r => (
            <button key={r} onClick={()=>setFilter(r)} className={`px-2.5 py-1 text-xs font-medium rounded-full border ${filter === r ? "bg-gray-900 border-gray-900 text-white" : "bg-white border-gray-200 text-gray-700 hover:border-gray-300"}`}>{r}</button>
          ))}
          <div className="flex-1"></div>
          <div className="relative">
            <Icon.Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
            <Input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search users…" className="pl-9 w-64"/>
          </div>
        </div>
        <Card>
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
              <tr>
                <th className="text-left font-medium px-4 py-2.5">User</th>
                <th className="text-left font-medium px-4 py-2.5">Role</th>
                <th className="text-left font-medium px-4 py-2.5">Joined</th>
                <th className="text-right font-medium px-4 py-2.5">Spaces</th>
                <th></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {rows.map(u => (
                <tr key={u.id} className="hover:bg-gray-50/50">
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-3">
                      <img src={u.avatar} alt={u.name} className="w-8 h-8 rounded-full object-cover bg-gray-100"/>
                      <div>
                        <div className="font-medium text-gray-900">{u.name}</div>
                        <div className="text-xs text-gray-500">{u.email}</div>
                      </div>
                    </div>
                  </td>
                  <td className="px-4 py-3"><span className={`text-[11px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ${ROLE_PILL[u.role]}`}>{u.role}</span></td>
                  <td className="px-4 py-3 text-gray-500">{u.joined}</td>
                  <td className="px-4 py-3 text-right text-gray-700">{u.spaces}</td>
                  <td className="px-4 py-3 text-right">
                    <Btn kind="ghost" icon={Icon.ChevronRight} onClick={()=>setManage(u)}>Manage</Btn>
                  </td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-500 text-sm">No users match those filters.</td></tr>}
            </tbody>
          </table>
        </Card>
        {manage && <UserManageDrawer user={manage} onClose={()=>setManage(null)}/>}
      </Page>
    );
  }

  // Right-side drawer for the Manage action on Users.
  // Lets an admin change role, view spaces/bookings counts, send a password
  // reset, suspend, or delete. Each action ends with a toast + (for the
  // destructive ones) a confirm dialog.
  function UserManageDrawer({ user, onClose }) {
    useStore();
    const u = USERS.find(x => x.id === user.id) || user;
    const userSpaces  = SPACES.filter(s => s.host === u.name);
    const userBookings = HOST_BOOKINGS.filter(b => b.guest === u.name);
    const change = (role) => {
      if (u.role === role) return;
      store.setUserRole(u.id, role);
      notify.success("Role updated", `${u.name} is now a ${role}.`);
    };
    const reset = () => {
      notify.info("Password reset link sent", `${u.email} will get an email to set a new password.`);
    };
    const suspend = () => {
      confirmBus.ask({
        title: `Suspend ${u.name}?`,
        message: "They'll be signed out and won't be able to book or host until you reinstate them.",
        confirmLabel: "Suspend account",
        tone: "warn",
        onConfirm: () => {
          notify.warn("Account suspended", `${u.name} can no longer sign in.`);
          onClose();
        },
      });
    };
    const remove = () => {
      confirmBus.ask({
        title: `Permanently delete ${u.name}'s account?`,
        message: "This wipes their profile and history. Existing bookings stay, but their personal data is removed. This cannot be undone.",
        confirmLabel: "Delete account",
        tone: "danger",
        onConfirm: () => {
          store.removeUser(u.id);
          notify.error("Account deleted", `${u.name}'s account is gone.`);
          onClose();
        },
      });
    };
    return (
      <div className="fixed inset-0 z-[45]" onClick={onClose}>
        <div className="absolute inset-0 bg-gray-900/40 backdrop-blur-[2px]"></div>
        <aside
          onClick={e=>e.stopPropagation()}
          className="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col"
          style={{ animation: "drIn .22s ease-out" }}>
          <div className="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
            <div className="text-sm font-semibold text-gray-900">Manage user</div>
            <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100" aria-label="Close"><Icon.X size={16}/></button>
          </div>
          <div className="flex-1 overflow-auto p-5">
            <div className="flex items-center gap-4">
              <img src={u.avatar} alt={u.name} className="w-14 h-14 rounded-full object-cover bg-gray-100"/>
              <div>
                <div className="font-semibold text-gray-900">{u.name}</div>
                <div className="text-xs text-gray-500">{u.email}</div>
                <div className="mt-1.5"><span className={`text-[11px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ${ROLE_PILL[u.role]}`}>{u.role}</span></div>
              </div>
            </div>

            <div className="mt-5 grid grid-cols-3 gap-2 text-center">
              <div className="p-3 rounded-lg bg-gray-50 border border-gray-100">
                <div className="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Joined</div>
                <div className="mt-1 text-[12px] font-medium text-gray-900 mono">{u.joined}</div>
              </div>
              <div className="p-3 rounded-lg bg-gray-50 border border-gray-100">
                <div className="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Spaces</div>
                <div className="mt-1 text-base font-semibold text-gray-900">{userSpaces.length}</div>
              </div>
              <div className="p-3 rounded-lg bg-gray-50 border border-gray-100">
                <div className="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Bookings</div>
                <div className="mt-1 text-base font-semibold text-gray-900">{userBookings.length}</div>
              </div>
            </div>

            <div className="mt-6">
              <div className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 mb-2">Role</div>
              <div className="grid grid-cols-3 gap-2">
                {["Guest","Host","Admin"].map(r => {
                  const active = u.role === r;
                  return (
                    <button key={r} onClick={()=>change(r)}
                      className={`px-3 py-2 rounded-lg border text-sm font-medium ${active ? "border-indigo-300 bg-indigo-50 text-indigo-700" : "border-gray-200 bg-white text-gray-700 hover:border-gray-300"}`}>
                      {r}
                    </button>
                  );
                })}
              </div>
            </div>

            {userSpaces.length > 0 && (
              <div className="mt-6">
                <div className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 mb-2">Hosted spaces</div>
                <ul className="border border-gray-200 rounded-lg divide-y divide-gray-100 overflow-hidden">
                  {userSpaces.map(s => (
                    <li key={s.id}>
                      <button onClick={()=>{ onClose(); go(`/host/spaces/${s.id}`); }}
                              className="w-full px-3 py-2.5 flex items-center justify-between hover:bg-gray-50 text-left">
                        <div className="flex items-center gap-2.5 min-w-0">
                          <img src={s.photo} alt={s.name} className="w-8 h-8 rounded-md object-cover bg-gray-100"/>
                          <div className="min-w-0">
                            <div className="text-sm font-medium text-gray-900 truncate">{s.name}</div>
                            <div className="text-[11px] text-gray-500 truncate">{s.city}</div>
                          </div>
                        </div>
                        <Icon.ChevronRight size={14} className="text-gray-400"/>
                      </button>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <div className="mt-6">
              <div className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 mb-2">Account actions</div>
              <div className="grid grid-cols-1 gap-2">
                <ActionRow icon={Icon.Mail}      label="Send password reset"     onClick={reset}/>
                <ActionRow icon={Icon.AlertTriangle} label="Suspend account"     onClick={suspend}/>
                <ActionRow icon={Icon.Trash}     label="Delete account"          onClick={remove}/>
              </div>
            </div>
          </div>
        </aside>
        <style>{`@keyframes drIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }`}</style>
      </div>
    );
  }

  // 20 · /system/health — System status
  function SystemHealth() {
    const services = [
      { n:"API",        s:"Operational", up:"99.99%" },
      { n:"Web app",    s:"Operational", up:"99.97%" },
      { n:"Stripe webhook", s:"Operational", up:"99.95%" },
      { n:"Resend (email)", s:"Operational", up:"99.92%" },
      { n:"Background jobs", s:"Operational", up:"99.96%" },
    ];
    const deploys = [
      { id:"#1842", at:"2h ago",  who:"Ada Hollander", msg:"feat(payouts): held-for-refund display" },
      { id:"#1841", at:"6h ago",  who:"Mira Yu",       msg:"fix(email): plain-text fallback on cancellation"},
      { id:"#1840", at:"1d ago",  who:"Ada Hollander", msg:"chore(deps): bump stripe to 16.2"},
      { id:"#1839", at:"2d ago",  who:"Sam Vidal",     msg:"refactor(host-bookings): unify status pills"},
    ];
    return (
      <Page>
        <PageHead title="System status" sub="Live operational view. Updates every 30 seconds."
                  right={<Pill kind="Approved">All systems operational</Pill>}/>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <StatCard k="Uptime · 90 days" v="99.96%" icon={Icon.Activity}/>
          <StatCard k="Avg response" v="148 ms" icon={Icon.Server}/>
          <StatCard k="Deploys · week" v="14" trend={{ dir:"up", text:"+3 vs. prev"}} icon={Icon.GitBranch}/>
        </div>
        <div className="grid md:grid-cols-2 gap-6">
          <Card className="p-5">
            <div className="font-semibold text-gray-900 mb-3">Services</div>
            <ul className="divide-y divide-gray-100">
              {services.map(s => (
                <li key={s.n} className="flex items-center justify-between py-2.5">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span className="text-sm text-gray-900">{s.n}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="mono text-[11px] text-gray-500">{s.up}</span>
                    <Pill kind="Approved">{s.s}</Pill>
                  </div>
                </li>
              ))}
            </ul>
          </Card>
          <Card className="p-5">
            <div className="font-semibold text-gray-900 mb-3">Recent deploys</div>
            <ul className="divide-y divide-gray-100">
              {deploys.map(d => (
                <li key={d.id} className="py-2.5">
                  <div className="flex items-center gap-2">
                    <code className="mono text-[11px] text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">{d.id}</code>
                    <span className="text-sm text-gray-900 truncate">{d.msg}</span>
                  </div>
                  <div className="text-xs text-gray-500 mt-0.5 ml-1">{d.who} · {d.at}</div>
                </li>
              ))}
            </ul>
          </Card>
        </div>
      </Page>
    );
  }

  // ════════════════════════════════════════════════════════════
  // ROUTE RESOLVER
  // ════════════════════════════════════════════════════════════
  function renderRoute(route, role, setRole) {
    // Dynamic routes
    if (route.startsWith("/space/")) {
      const id = route.split("/")[2];
      return { audience: "Public", body: <SpaceDetail id={id}/> };
    }
    if (route.startsWith("/admin/applications/")) {
      const id = route.split("/")[3];
      return { audience: "Admin", body: <AdminApplicationDetail id={id}/> };
    }
    if (route === "/host/spaces/new") return { audience: "Host", body: <HostSpaceNew/> };
    if (route.startsWith("/host/spaces/")) {
      const id = route.split("/")[3];
      return { audience: "Host", body: <HostSpaceEdit id={id}/> };
    }

    switch (route) {
      case "/":              return { audience:"Public", body:<Public/> };
      case "/browse":        return { audience:"Public", body:<Browse/> };
      case "/booking/new":   return { audience:"Guest",  body:<BookingFlow/> };
      case "/bookings":      return { audience:"Guest",  body:<MyBookings/> };
      case "/login":         return { audience:"Public", body:<Login setRole={setRole}/> };
      case "/signup":        return { audience:"Public", body:<Signup setRole={setRole}/> };
      case "/account":       return { audience:"Guest",  body:<Account/> };
      case "/become-a-host": return { audience:"Guest",  body:<BecomeAHost setRole={setRole}/> };
      case "/admin/applications": return { audience:"Admin", body:<AdminApplications/> };
      case "/host":           return { audience:"Host",  body:<HostDashboard/> };
      case "/host/spaces":    return { audience:"Host",  body:<HostSpaces/> };
      case "/host/bookings":  return { audience:"Host",  body:<HostBookings/> };
      case "/host/payouts":   return { audience:"Host",  body:<HostPayouts/> };
      case "/host/onboarding":return { audience:"Host",  body:<HostOnboarding/> };
      case "/admin/users":    return { audience:"Admin", body:<AdminUsers/> };
      case "/system/health":  return { audience:"System",body:<SystemHealth/> };
      default: return { audience:"Public", body:
        <Page max="max-w-xl">
          <PageHead title="Not found" sub={`No screen at ${route}`}/>
          <Btn onClick={()=>go("/")} icon={Icon.Home}>Back to landing</Btn>
        </Page> };
    }
  }

  // ════════════════════════════════════════════════════════════
  // APP
  // ════════════════════════════════════════════════════════════
  function App() {
    const route = useHashRoute();
    const [role, setRole] = useState("public");

    // Auto-elevate role based on route group (so a fresh load of /host works)
    useEffect(() => {
      if (route.startsWith("/admin/") && role !== "admin") setRole("admin");
      else if (route.startsWith("/host") && role !== "host") setRole("host");
      else if (route.startsWith("/system/") && role !== "admin") setRole("admin");
      else if (["/bookings","/account","/become-a-host","/booking/new"].includes(route) && role === "public") setRole("guest");
      // eslint-disable-next-line
    }, [route]);

    const { audience, body } = renderRoute(route, role, setRole);
    return (
      <Shell role={role} setRole={setRole} route={route} audience={audience}>
        {body}
      </Shell>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
