<!doctype html>
<!-- Narrow widths: search bar full-width under the page heading; grid collapses 3 → 2 → 1 column. Editorial layout falls back to grid; list keeps single column. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeskHive — Browse spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13/dist/index.global.min.js"></script>
  <link rel="stylesheet" href="shared.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ───── Mood themes (override neutrals / type tone) ───── */
    body[data-mood="daylight"] {
      background: var(--color-neutral-50);
      color: var(--color-neutral-900);
    }
    body[data-mood="dusk"] {
      background: #0E0F1A;
      color: #E7E7EE;
      --color-border: #23253A;
      --color-border-strong: #2C2E47;
      --color-neutral-0: #14152200;
      --surface: #14162A;
      --surface-2: #181A33;
      --muted-fg: #9A9CB6;
      --muted-2-fg: #6F7196;
      --hairline: #2A2C45;
      --price-fg: #B8BAD8;
      --display-grad: linear-gradient(180deg, #fff 0%, #C7C9F5 100%);
    }
    body[data-mood="dusk"] .site-header {
      background: rgba(14,15,26,.72);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-bottom-color: var(--hairline);
    }
    body[data-mood="dusk"] .site-header .nav-link { color: #B8BAD8; }
    body[data-mood="dusk"] .site-header .nav-link[aria-current] { color: #fff; }
    body[data-mood="dusk"] .site-footer {
      background: transparent;
      color: var(--muted-2-fg);
      border-top-color: var(--hairline);
    }
    body[data-mood="dusk"] .input {
      background: var(--surface);
      color: #E7E7EE;
      border-color: var(--hairline);
    }
    body[data-mood="dusk"] .input::placeholder { color: var(--muted-2-fg); }
    body[data-mood="dusk"] .glyph { color: var(--muted-2-fg); }

    body[data-mood="paper"] {
      background: #F4EFE6;
      color: #2A1F14;
      --color-border: #DCD2BF;
      --color-border-strong: #C8BBA0;
      --surface: #FBF7EF;
      --surface-2: #F0E9D8;
      --muted-fg: #6E5F47;
      --muted-2-fg: #8C7C61;
      --hairline: #DCD2BF;
      --price-fg: #4A3A22;
      --display-grad: none;
    }
    body[data-mood="paper"] .site-header {
      background: #F4EFE6;
      border-bottom-color: var(--hairline);
    }
    body[data-mood="paper"] .site-footer { background: transparent; border-top-color: var(--hairline); }
    body[data-mood="paper"] .input {
      background: var(--surface);
      color: #2A1F14;
      border-color: var(--hairline);
    }
    body[data-mood="paper"] .input::placeholder { color: var(--muted-2-fg); }
    body[data-mood="paper"] .glyph { color: var(--muted-2-fg); }

    body[data-mood="daylight"] {
      --surface: var(--color-neutral-0);
      --surface-2: var(--color-neutral-50);
      --muted-fg: var(--color-neutral-600);
      --muted-2-fg: var(--color-neutral-500);
      --hairline: var(--color-border);
      --price-fg: var(--color-neutral-700);
      --display-grad: none;
    }

    /* ───── Display headline ───── */
    .hero-display {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 700;
    }
    body[data-mood="dusk"] .hero-display {
      background: var(--display-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ───── Personality: editorial uses serif display ───── */
    body[data-personality="magazine"] .hero-display,
    body[data-personality="magazine"] .card-title {
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    body[data-personality="magazine"] .hero-display {
      font-style: italic;
      font-weight: 500;
    }
    body[data-personality="ticket"] .card-title {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    /* ───── Search input ───── */
    .search-wrap { position: relative; }
    .search-wrap .input { padding-left: 2.5rem; height: 2.75rem; font-size: 15px; }
    .search-wrap .glyph {
      position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 14px;
    }
    .results-meta { font-size: 13px; color: var(--muted-2-fg); }

    /* ───── Layout: grid ───── */
    .grid-spaces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
    @media (max-width: 900px) { .grid-spaces { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .grid-spaces { grid-template-columns: 1fr; } }

    /* ───── Layout: editorial — feature spans 2 cols every 6th, with rhythm ───── */
    .grid-editorial { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.5rem 1.25rem; }
    .grid-editorial .card-link { grid-column: span 2; }
    .grid-editorial .card-link.feature { grid-column: span 4; }
    .grid-editorial .card-link.tall { grid-column: span 2; }
    .grid-editorial .card-link.feature .card-photo { aspect-ratio: 16/9; }
    @media (max-width: 900px) {
      .grid-editorial { grid-template-columns: repeat(2, 1fr); }
      .grid-editorial .card-link, .grid-editorial .card-link.feature, .grid-editorial .card-link.tall { grid-column: span 1; }
      .grid-editorial .card-link.feature .card-photo { aspect-ratio: 4/3; }
    }

    /* ───── Layout: list — horizontal media cards, single column ───── */
    .grid-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .grid-list .card-link { display: block; }
    .grid-list .card { display: grid; grid-template-columns: 240px 1fr auto; align-items: center; gap: 0; overflow: hidden; }
    .grid-list .card-photo { aspect-ratio: auto; height: 140px; width: 240px; }
    .grid-list .card-body { padding: 1rem 1.25rem; min-width: 0; }
    .grid-list .card-trail { padding-right: 1.25rem; text-align: right; }
    @media (max-width: 700px) {
      .grid-list .card { grid-template-columns: 120px 1fr; }
      .grid-list .card-photo { width: 120px; height: 110px; }
      .grid-list .card-trail { display: none; }
    }

    /* ───── Card base (overrides shared.css for moods) ───── */
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: border-color .15s ease, box-shadow .15s ease, transform .2s ease;
    }
    .card-link:hover .card { border-color: var(--color-border-strong); transform: translateY(-1px); }
    .card-photo {
      display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover;
      background: var(--surface-2);
    }
    .card-body { padding: 1rem 1.125rem 1.125rem; }
    .card-title { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
    .card-city { margin-top: 2px; font-size: 13px; color: var(--muted-fg); }
    .price-tag {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--price-fg);
      text-transform: uppercase;
    }

    /* ───── Personality: magazine — overlay caption, no border, big imagery ───── */
    body[data-personality="magazine"] .card {
      border: none;
      border-radius: 4px;
      background: transparent;
    }
    body[data-personality="magazine"] .card-photo {
      border-radius: 4px;
      aspect-ratio: 5/6;
      filter: contrast(1.04) saturate(1.05);
    }
    body[data-personality="magazine"] .grid-spaces .card-photo,
    body[data-personality="magazine"] .grid-editorial .card-photo { aspect-ratio: 4/5; }
    body[data-personality="magazine"] .grid-editorial .card-link.feature .card-photo { aspect-ratio: 16/10; }
    body[data-personality="magazine"] .card-body { padding: 0.875rem 0 0; }
    body[data-personality="magazine"] .card-title { font-size: 1.5rem; line-height: 1.05; }
    body[data-personality="magazine"] .price-tag { color: var(--muted-fg); }
    body[data-personality="magazine"] .card-link:hover .card-photo { filter: contrast(1.06) saturate(1.1) brightness(0.98); }

    /* ───── Personality: ticket — stamped frame, dotted divider, mono-heavy ───── */
    body[data-personality="ticket"] .card {
      border-radius: 6px;
      border-style: dashed;
      border-color: var(--color-border-strong);
      background: var(--surface);
      box-shadow: 0 0 0 6px var(--surface) inset, 0 0 0 7px var(--hairline) inset;
      padding: 6px;
    }
    body[data-personality="ticket"] .card-photo { border-radius: 2px; aspect-ratio: 4/3; }
    body[data-personality="ticket"] .card-body {
      padding: 0.875rem 0.5rem 0.5rem;
      border-top: 1px dashed var(--color-border-strong);
      margin-top: 0.625rem;
      position: relative;
    }
    body[data-personality="ticket"] .card-body::before,
    body[data-personality="ticket"] .card-body::after {
      content: ''; position: absolute; top: -8px; width: 12px; height: 12px;
      background: var(--color-neutral-50); border-radius: 50%;
    }
    body[data-mood="dusk"] body[data-personality="ticket"] .card-body::before,
    body[data-mood="dusk"] body[data-personality="ticket"] .card-body::after { background: #0E0F1A; }
    body[data-personality="ticket"] .card-body::before { left: -14px; }
    body[data-personality="ticket"] .card-body::after { right: -14px; }
    body[data-personality="ticket"] .card-city {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
    }
    body[data-personality="ticket"] .price-tag { font-weight: 500; }

    /* List layout adjustments per personality */
    body[data-personality="magazine"] .grid-list .card { grid-template-columns: 280px 1fr auto; }
    body[data-personality="magazine"] .grid-list .card-title { font-size: 1.375rem; }
    body[data-personality="magazine"] .grid-list .card-photo { aspect-ratio: auto; height: 160px; width: 280px; }

    /* Header/footer on dusk text-color helpers */
    body[data-mood="dusk"] .logo { color: #fff; }
    body[data-mood="dusk"] h1, body[data-mood="dusk"] h2, body[data-mood="dusk"] h3 { color: #F0F0F8; }

    /* Hero copy */
    .hero-sub { color: var(--muted-fg); font-size: 1rem; max-width: 36rem; }

    /* h2 reset using mood vars */
    .h2-section { font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }
  </style>

<body data-screen-label="01 Landing / Browse Spaces">
  <div id="app"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "layout": "list",
      "mood": "daylight",
      "personality": "quiet"
    }/*EDITMODE-END*/;

    const SPACES = [
      { id: 'the-hive-riverside', name: 'The Hive — Riverside', city: 'Brooklyn, NY', price: 'FROM $28 / DAY',
        img: window.__resources.photo_hive,
        alt: 'Open coworking floor with long shared desks' },
      { id: 'northgate-studios', name: 'Northgate Studios', city: 'Seattle, WA', price: 'FROM $24 / DAY',
        img: window.__resources.photo_northgate,
        alt: 'Bright loft workspace with plants and laptops' },
      { id: 'cedar-and-co', name: 'Cedar & Co.', city: 'Austin, TX', price: 'FROM $22 / DAY',
        img: window.__resources.photo_cedar,
        alt: 'Modern coworking space with warm wood tones' },
      { id: 'folk-house', name: 'Folk House', city: 'Lisbon, PT', price: 'FROM €18 / DAY',
        img: window.__resources.photo_folk,
        alt: 'Sunlit workspace with mid-century chairs' },
      { id: 'atlas-workrooms', name: 'Atlas Workrooms', city: 'Berlin, DE', price: 'FROM €20 / DAY',
        img: window.__resources.photo_atlas,
        alt: 'Industrial-style office with large windows' },
      { id: 'mission-annex', name: 'Mission Annex', city: 'San Francisco, CA', price: 'FROM $32 / DAY',
        img: window.__resources.photo_mission,
        alt: 'Coworking lounge with sofas and laptops' },
      { id: 'harbor-and-vine', name: 'Harbor & Vine', city: 'Boston, MA', price: 'FROM $26 / DAY',
        img: window.__resources.photo_harbor,
        alt: 'Quiet study room with shared desks' },
      { id: 'glasshouse', name: 'Glasshouse', city: 'Toronto, ON', price: 'FROM C$24 / DAY',
        img: window.__resources.photo_glasshouse,
        alt: 'Bright glass-walled coworking room' },
      { id: 'old-mill-coworking', name: 'Old Mill Coworking', city: 'Portland, OR', price: 'FROM $20 / DAY',
        img: window.__resources.photo_oldmill,
        alt: 'Brick-walled coworking studio with desks' },
    ];

    function SpaceCard({ s, variant }) {
      return (
        <a href={`02-space-detail.html?id=${s.id}`} className={`card-link${variant ? ' ' + variant : ''}`}>
          <article className="card">
            <img className="card-photo" src={s.img} alt={s.alt} loading="lazy" />
            <div className="card-body">
              <h3 className="card-title">{s.name}</h3>
              <p className="card-city">{s.city}</p>
              <p className="price-tag tnum" style={{ marginTop: '12px' }}>{s.price}</p>
            </div>
          </article>
        </a>
      );
    }

    function ListRow({ s }) {
      return (
        <a href={`02-space-detail.html?id=${s.id}`} className="card-link">
          <article className="card">
            <img className="card-photo" src={s.img} alt={s.alt} loading="lazy" />
            <div className="card-body">
              <h3 className="card-title">{s.name}</h3>
              <p className="card-city">{s.city}</p>
            </div>
            <div className="card-trail">
              <p className="price-tag tnum">{s.price}</p>
            </div>
          </article>
        </a>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [query, setQuery] = React.useState('');

      // Apply tweaks at body level so CSS variants in <style> can target them.
      React.useEffect(() => {
        document.body.dataset.mood = t.mood;
        document.body.dataset.personality = t.personality;
        document.body.dataset.layout = t.layout;
      }, [t.mood, t.personality, t.layout]);

      const filtered = SPACES.filter(s =>
        !query.trim() || s.city.toLowerCase().includes(query.trim().toLowerCase())
      );

      // Editorial: every 6th card is a feature (spans 4 of 6 cols)
      const editorialClass = (i) => (i % 6 === 0 ? 'feature' : (i % 6 === 4 ? 'tall' : ''));

      const headline = t.personality === 'magazine'
        ? <>A desk for the <em>day.</em></>
        : <>Find a desk for the day.</>;

      const sub = t.personality === 'ticket'
        ? 'PICK A CITY · PICK A DATE · SHOW UP'
        : 'Coworking spaces you can book by the day — pick a city, pick a date, show up.';

      return (
        <>
          <header className="site-header">
            <div className="site-header-inner">
              <a href="01-landing.html" className="logo">
                <span className="logo-mark" aria-hidden="true"></span>
                <span>DeskHive</span>
              </a>
              <nav className="flex items-center gap-1">
                <a href="01-landing.html" className="nav-link" aria-current="page">Browse spaces</a>
                <a href="#" className="nav-link">How it works</a>
                <span className="mx-2 h-5 w-px" style={{ background: 'var(--hairline)' }}></span>
                <a href="04-login.html" className="nav-link">Log in</a>
                <a href="03-register.html" className="btn btn-primary btn-sm">Sign up</a>
              </nav>
            </div>
          </header>

          <main className="container-content" style={{ paddingTop: '3.5rem', paddingBottom: '4rem' }}>
            <section style={{ maxWidth: '40rem' }}>
              <h1 className="hero-display">{headline}</h1>
              <p
                className="hero-sub"
                style={{
                  marginTop: t.personality === 'ticket' ? '0.875rem' : '1rem',
                  fontFamily: t.personality === 'ticket' ? 'JetBrains Mono, ui-monospace, monospace' : undefined,
                  fontSize: t.personality === 'ticket' ? '12px' : undefined,
                  letterSpacing: t.personality === 'ticket' ? '0.08em' : undefined,
                }}
              >
                {sub}
              </p>
            </section>

            <section style={{ marginTop: '2rem' }}>
              <form role="search" aria-label="Filter spaces by city" className="flex flex-col sm:flex-row gap-3" style={{ maxWidth: '40rem' }}>
                <div className="search-wrap flex-1">
                  <span className="glyph" aria-hidden="true">⌕</span>
                  <label htmlFor="city-search" className="sr-only">City</label>
                  <input
                    id="city-search" type="search" className="input"
                    placeholder="Search by city — e.g. Brooklyn, Austin, Lisbon"
                    value={query} onChange={(e) => setQuery(e.target.value)}
                    autoComplete="off"
                  />
                </div>
              </form>
            </section>

            <section className="flex items-baseline justify-between gap-4" style={{ marginTop: '2.5rem' }}>
              <h2 className="h2-section">{query ? 'Matching spaces' : 'All spaces'}</h2>
              <p className="results-meta tnum">{filtered.length} {filtered.length === 1 ? 'space' : 'spaces'}</p>
            </section>

            <section style={{ marginTop: '1.25rem' }}
                     className={t.layout === 'editorial' ? 'grid-editorial'
                              : t.layout === 'list' ? 'grid-list'
                              : 'grid-spaces'}>
              {filtered.map((s, i) => (
                t.layout === 'list'
                  ? <ListRow key={s.id} s={s} />
                  : <SpaceCard key={s.id} s={s} variant={t.layout === 'editorial' ? editorialClass(i) : ''} />
              ))}
            </section>
          </main>

          <footer className="site-footer">
            <div className="site-footer-inner">
              <span>© 2026 DeskHive</span>
              <span className="font-mono" style={{ fontSize: '11px', letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--muted-2-fg)' }}>MVP · v0.1</span>
            </div>
          </footer>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Layout rhythm" />
            <TweakRadio
              label="Layout"
              value={t.layout}
              options={['grid', 'editorial', 'list']}
              onChange={(v) => setTweak('layout', v)}
            />
            <TweakSection label="Mood" />
            <TweakRadio
              label="Palette"
              value={t.mood}
              options={['daylight', 'dusk', 'paper']}
              onChange={(v) => setTweak('mood', v)}
            />
            <TweakSection label="Card personality" />
            <TweakRadio
              label="Style"
              value={t.personality}
              options={['quiet', 'magazine', 'ticket']}
              onChange={(v) => setTweak('personality', v)}
            />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
